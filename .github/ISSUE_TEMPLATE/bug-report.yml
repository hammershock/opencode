name: Bug report
description: Report a reproducible OpenCode Transit defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Transit bug. Search existing issues first. For vulnerabilities, stop here and use the private Security Advisory link from the issue chooser.

  - type: input
    id: version
    attributes:
      label: Transit version
      description: Paste `opencode-transit --version` or the exact source commit.
      placeholder: 1.x.y-transit.0+abcdef123456
    validations:
      required: true

  - type: dropdown
    id: controller
    attributes:
      label: Controller platform
      options:
        - macOS Apple Silicon (arm64)
        - Windows WSL2 / Ubuntu (x64)
        - Unsupported or other platform
    validations:
      required: true

  - type: dropdown
    id: location
    attributes:
      label: Location
      options:
        - Local workspace
        - SSH + managed Rexd workspace
        - Startup or no Session Location
        - Not related to a Location
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the observable behavior and any error shown.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the result you expected at the same boundary.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest repeatable steps using disposable data. Include target OS/shell when relevant.
      placeholder: |
        1. Start opencode-transit in...
        2. Select...
        3. Run...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add logs, screenshots, or recordings after removing secrets, private hosts, personal paths, account IDs, and real Session content.
    validations:
      required: false

  - type: input
    id: regression
    attributes:
      label: Last known working version
      description: If this is a regression, provide the last version or commit where it worked.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find the same report.
          required: true
        - label: I removed credentials and private machine or account data from this public report.
          required: true
