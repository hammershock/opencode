name: pr-standards

on:
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  check-standards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check PR standards
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const login = pr.user.login;

            // Skip PRs older than Feb 18, 2026 at 6PM EST (Feb 19, 2026 00:00 UTC)
            const cutoff = new Date('2026-02-19T00:00:00Z');
            const prCreated = new Date(pr.created_at);
            if (prCreated < cutoff) {
              console.log(`Skipping: PR #${pr.number} was created before cutoff (${prCreated.toISOString()})`);
              return;
            }

            // Check if author is a team member or bot
            if (login === 'opencode-agent[bot]') return;
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/TEAM_MEMBERS',
              ref: 'dev'
            });
            const members = Buffer.from(file.content, 'base64').toString().split('\n').map(l => l.trim()).filter(Boolean);
            if (members.includes(login)) {
              console.log(`Skipping: ${login} is a team member`);
              return;
            }

            const title = pr.title;

            async function addLabel(label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [label]
              });
            }

            async function removeLabel(label) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                });
              } catch (e) {
                // Label wasn't present, ignore
              }
            }

            async function comment(marker, body) {
              const markerText = `<!-- pr-standards:${marker} -->`;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });
              
              const existing = comments.find(c => c.body.includes(markerText));
              if (existing) return;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: markerText + '\n' + body
              });
            }

            // Step 1: Check title format
            // Matches: feat:, feat(scope):, feat (scope):, etc.
            const titlePattern = /^(feat|fix|docs|chore|refactor|test)\s*(\([a-zA-Z0-9-]+\))?\s*:/;
            const hasValidTitle = titlePattern.test(title);

            if (!hasValidTitle) {
              await addLabel('needs:title');
              await comment('title', `Hey! Your PR title \`${title}\` doesn't follow conventional commit format.

            Please update it to start with one of:
            - \`feat:\` or \`feat(scope):\` new feature
            - \`fix:\` or \`fix(scope):\` bug fix
            - \`docs:\` or \`docs(scope):\` documentation changes
            - \`chore:\` or \`chore(scope):\` maintenance tasks
            - \`refactor:\` or \`refactor(scope):\` code refactoring
            - \`test:\` or \`test(scope):\` adding or updating tests

            Where \`scope\` is the package name (e.g., \`app\`, \`desktop\`, \`opencode\`).

            See [CONTRIBUTING.md](../blob/dev/CONTRIBUTING.md#open-the-pull-request) for details.`);
              return;
            }

            await removeLabel('needs:title');

            // Step 2: Check for one linked primary issue
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number
            });

            const linkedIssues = result.repository.pullRequest.closingIssuesReferences.totalCount;

            if (linkedIssues === 0) {
              await addLabel('needs:issue');
              await comment('issue', `Thanks for your contribution!

            This PR doesn't have a linked issue. All PRs must reference an existing issue.

            Please:
            1. Open an issue describing the bug/feature (if one doesn't exist)
            2. Add \`Fixes #<number>\` or \`Closes #<number>\` to this PR description

            See [CONTRIBUTING.md](../blob/dev/CONTRIBUTING.md#start-with-an-issue) for details.`);
              return;
            }

            await removeLabel('needs:issue');
            console.log('PR meets all standards');

  check-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check PR template compliance
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const login = pr.user.login;

            // Skip PRs older than Feb 18, 2026 at 6PM EST (Feb 19, 2026 00:00 UTC)
            const cutoff = new Date('2026-02-19T00:00:00Z');
            const prCreated = new Date(pr.created_at);
            if (prCreated < cutoff) {
              console.log(`Skipping: PR #${pr.number} was created before cutoff (${prCreated.toISOString()})`);
              return;
            }

            // Check if author is a team member or bot
            if (login === 'opencode-agent[bot]') return;
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.github/TEAM_MEMBERS',
              ref: 'dev'
            });
            const members = Buffer.from(file.content, 'base64').toString().split('\n').map(l => l.trim()).filter(Boolean);
            if (members.includes(login)) {
              console.log(`Skipping: ${login} is a team member`);
              return;
            }

            const body = pr.body || '';
            const issues = [];

            function section(marker) {
              const start = body.indexOf(marker);
              if (start === -1) return undefined;
              const rest = body.slice(start + marker.length);
              const end = rest.indexOf('\n## ');
              return end === -1 ? rest : rest.slice(0, end);
            }

            function meaningful(value) {
              return (value || '').replace(/<!--[\s\S]*?-->/g, '').trim();
            }

            // Check: template sections exist
            const issueSection = section('## Issue and outcome');
            const scopeSection = section('## Scope and boundaries');
            const verifySection = section('## Verification');
            const platformSection = section('### Platform coverage');
            const uiSection = section('## UI evidence');
            const checklistSection = section('## Checklist');

            if ([issueSection, scopeSection, verifySection, platformSection, uiSection, checklistSection].some((value) => value === undefined)) {
              issues.push('PR description is missing required template sections. Please use the [PR template](../blob/dev/.github/pull_request_template.md).');
            }

            if (issueSection !== undefined) {
              const content = meaningful(issueSection);
              const references = [...content.matchAll(/(?:closes|fixes|resolves)\s+#\d+/gi)];
              if (references.length !== 1) {
                issues.push('"Issue and outcome" must close exactly one primary issue with `Closes #<number>`.');
              }
              const outcome = content.replace(/(?:closes|fixes|resolves)\s+#\d+/gi, '').trim();
              if (outcome.length < 20) {
                issues.push('"Issue and outcome" needs a concise explanation of the observable result.');
              }
            }

            if (scopeSection !== undefined) {
              const content = meaningful(scopeSection);
              if (content.length < 10) {
                issues.push('"Scope and boundaries" is empty. Describe compatibility, security, migration, or deliberately unchanged behavior.');
              }
            }

            if (verifySection !== undefined) {
              const content = meaningful(verifySection.split('\n### Platform coverage')[0]);
              if (content.length < 10) {
                issues.push('"Verification" is empty. List exact commands, manual checks, and results.');
              }
            }

            if (platformSection !== undefined) {
              if (!/- \[x\]/i.test(platformSection)) {
                issues.push('Select at least one platform coverage option and list anything not run.');
              }
            }

            if (checklistSection !== undefined) {
              const unchecked = (checklistSection.match(/- \[ \]/g) || []).length;
              const checked = (checklistSection.match(/- \[x\]/gi) || []).length;
              if (unchecked > 0 || checked < 7) {
                issues.push('Complete every PR checklist item, including verification gaps and private-data review.');
              }
            }

            // Helper functions
            async function addLabel(label) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [label]
              });
            }

            async function removeLabel(label) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                });
              } catch (e) {}
            }

            const hasComplianceLabel = pr.labels.some(l => l.name === 'needs:compliance');

            if (issues.length > 0) {
              // Non-compliant
              if (!hasComplianceLabel) {
                await addLabel('needs:compliance');
              }

              const marker = '<!-- issue-compliance -->';
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });
              const existing = comments.find(c => c.body.includes(marker));

              const body_text = `${marker}
            This PR doesn't fully meet our [contributing guidelines](../blob/dev/CONTRIBUTING.md) and [PR template](../blob/dev/.github/pull_request_template.md).

            **What needs to be fixed:**
            ${issues.map(i => `- ${i}`).join('\n')}

            Please edit this PR description to address the above within **7 days**, or it will be automatically closed.

            If you believe this was flagged incorrectly, please let a maintainer know.`;

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: body_text
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: body_text
                });
              }

              console.log(`PR #${pr.number} is non-compliant: ${issues.join(', ')}`);
            } else if (hasComplianceLabel) {
              // Was non-compliant, now fixed
              await removeLabel('needs:compliance');

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });
              const marker = '<!-- issue-compliance -->';
              const existing = comments.find(c => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id
                });
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: 'Thanks for updating your PR! It now meets our contributing guidelines. :+1:'
              });

              console.log(`PR #${pr.number} is now compliant, label removed`);
            } else {
              console.log(`PR #${pr.number} is compliant`);
            }
